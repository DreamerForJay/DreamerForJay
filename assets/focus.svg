<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 42'
    style='background-color: #00000000;'
    width='600px' height='42px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='4400ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h600 ; m0,21 h600 ; m0,21 h0' keyTimes='0;0.50909090909091;0.87272727272727;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#168B91' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Visual perception. Interpretable geometry.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4400ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h600 ; m0,21 h600 ; m0,21 h0' keyTimes='0;0.50909090909091;0.87272727272727;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#168B91' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
